spring:
  datasource:
    url: jdbc:h2:mem:ecommerce_test_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
logging:
  level:
    org.springframework: WARN
    br.edu.fatec.ecommerce: INFO

ecommerce:
  modulo1:
    seed-demo-ativo: false


